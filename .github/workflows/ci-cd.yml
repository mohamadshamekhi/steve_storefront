name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    steps:
      # the runner's route to the server is flaky: wait for the port here rather
      # than retry the deploy script, which isn't safe to run twice after a partial failure
      - name: Wait for SSH port
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          for i in $(seq 1 20); do
            if timeout 10 bash -c 'exec 3<>"/dev/tcp/$DEPLOY_HOST/22"'; then
              echo "port 22 reachable on attempt $i"
              exit 0
            fi
            echo "attempt $i/20: port 22 unreachable, retrying in 15s"
            sleep 15
          done
          echo "::error::port 22 stayed unreachable from this runner"
          exit 1

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          script: |
            set -exo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            IMAGE_NAME="storefront:latest"
            CONTAINER_NAME="storefront"

            git config --global --add safe.directory "$DEPLOY_PATH"

            # clone on first deploy
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone git@github-storefront:mohamadshamekhi/steve_storefront.git "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git fetch --prune origin
            git reset --hard origin/main
            [ -f .env.production ] || { echo ".env.production missing"; exit 1; }

            docker build -t "$IMAGE_NAME" .

            # stop any container using port 3000
            OLD=$(docker ps -q --filter "publish=3000") && [ -n "$OLD" ] && docker stop $OLD && docker rm $OLD || true
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm   "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 3000:3000 \
              "$IMAGE_NAME"

            # smoke test
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null -m 5 http://localhost:3000/ && echo "app is up" && break || true
              [ $i -eq 30 ] && { docker logs --tail=50 "$CONTAINER_NAME"; exit 1; }
              sleep 2
            done

            docker image prune -f >/dev/null || true
            echo "Deploy done"
