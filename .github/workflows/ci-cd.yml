name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: production
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -euo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            IMAGE_NAME="storefront:latest"
            CONTAINER_NAME="storefront"

            git config --global --add safe.directory "$DEPLOY_PATH"

            # clone on first deploy, pull on subsequent ones
            if [ ! -d "$DEPLOY_PATH/.git" ]; then
              git clone git@github.com:mohamadshamekhi/steve_storefront.git "$DEPLOY_PATH"
            else
              cd "$DEPLOY_PATH"
              git fetch --prune origin
              git reset --hard origin/main
            fi

            cd "$DEPLOY_PATH"
            [ -f .env.production ] || { echo ".env.production missing"; exit 1; }

            docker build -t "$IMAGE_NAME" .
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm   "$CONTAINER_NAME" 2>/dev/null || true
            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 3000:3000 \
              "$IMAGE_NAME"

            # smoke test
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null -m 5 http://localhost:3000/ && echo "app is up" && break || true
              [ $i -eq 30 ] && { docker logs --tail=50 "$CONTAINER_NAME"; exit 1; }
              sleep 2
            done

            docker image prune -f >/dev/null || true
            echo "Deploy done"
