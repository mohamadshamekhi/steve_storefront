name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    needs: ci
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment: Production
    steps:
      # the runner's route to the server is flaky: wait for the port here rather
      # than retry the deploy script, which isn't safe to run twice after a partial failure
      - name: Wait for SSH port
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
        run: |
          for i in $(seq 1 20); do
            if timeout 10 bash -c 'exec 3<>"/dev/tcp/$DEPLOY_HOST/22"'; then
              echo "port 22 reachable on attempt $i"
              exit 0
            fi
            echo "attempt $i/20: port 22 unreachable, retrying in 15s"
            sleep 15
          done
          echo "::error::port 22 stayed unreachable from this runner"
          exit 1

      # the server can't reach github.com (Iran network), so it never pulls:
      # the runner ships the checked-out source to it instead
      - uses: actions/checkout@v4

      - name: Pack source
        run: git archive --format=tar.gz -o storefront-src.tgz HEAD

      - name: Upload source
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 10m
          source: storefront-src.tgz
          target: /tmp/storefront-deploy

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_SSH_HOST }}
          username: ${{ secrets.DEPLOY_SSH_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          timeout: 60s
          command_timeout: 30m
          script: |
            set -exo pipefail
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            IMAGE_NAME="storefront:latest"
            CONTAINER_NAME="storefront"
            ARCHIVE=/tmp/storefront-deploy/storefront-src.tgz

            # .env.production is not in git - it lives only in $DEPLOY_PATH on the server
            [ -f "$DEPLOY_PATH/.env.production" ] || { echo ".env.production missing in $DEPLOY_PATH"; exit 1; }

            BUILD_DIR=$(mktemp -d /tmp/storefront-build.XXXXXX)
            trap 'rm -rf "$BUILD_DIR" /tmp/storefront-deploy' EXIT
            tar -xzf "$ARCHIVE" -C "$BUILD_DIR"
            cp "$DEPLOY_PATH/.env.production" "$BUILD_DIR/"

            docker build -t "$IMAGE_NAME" "$BUILD_DIR"

            # stop any container using port 3000
            OLD=$(docker ps -q --filter "publish=3000") && [ -n "$OLD" ] && docker stop $OLD && docker rm $OLD || true
            docker stop "$CONTAINER_NAME" 2>/dev/null || true
            docker rm   "$CONTAINER_NAME" 2>/dev/null || true

            docker run -d \
              --name "$CONTAINER_NAME" \
              --restart unless-stopped \
              -p 3000:3000 \
              "$IMAGE_NAME"

            # smoke test
            for i in $(seq 1 30); do
              curl -fsS -o /dev/null -m 5 http://localhost:3000/ && echo "app is up" && break || true
              [ $i -eq 30 ] && { docker logs --tail=50 "$CONTAINER_NAME"; exit 1; }
              sleep 2
            done

            docker image prune -f >/dev/null || true
            echo "Deploy done"
