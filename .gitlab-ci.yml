stages:
  - build
  - deploy

variables:
  IMAGE_TAG: $CI_REGISTRY_IMAGE:$CI_COMMIT_SHORT_SHA
  IMAGE_LATEST: $CI_REGISTRY_IMAGE:latest

# ---------------------------------------------------
# مرحله بیلد: ساخت ایمیج داکر و پوش به GitLab Registry
# ---------------------------------------------------
build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  variables:
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    # لاگین به GitLab Container Registry با توکن خودکار CI
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - docker build -t "$IMAGE_TAG" -t "$IMAGE_LATEST" .
    - docker push "$IMAGE_TAG"
    - docker push "$IMAGE_LATEST"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# ---------------------------------------------------
# مرحله دیپلوی: اتصال SSH به سرور و اجرای ایمیج جدید
# ---------------------------------------------------
deploy:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    # دیکد کردن کلید از base64 تا مشکل خط‌های جدید پیش نیاد
    - echo "$SSH_PRIVATE_KEY_B64" | base64 -d > ~/.ssh/deploy_key
    - chmod 600 ~/.ssh/deploy_key
    - ssh-add ~/.ssh/deploy_key
    - ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts
  script:
    - |
      ssh "$SSH_USER@$SSH_HOST" "
        echo $CI_REGISTRY_PASSWORD | docker login -u $CI_REGISTRY_USER --password-stdin $CI_REGISTRY &&
        docker pull $IMAGE_LATEST &&
        docker stop storefront || true &&
        docker rm storefront || true &&
        docker run -d --name storefront --restart unless-stopped -p 3000:3000 $IMAGE_LATEST
      "
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
  needs:
    - build